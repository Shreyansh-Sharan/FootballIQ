[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "footballiq"
version = "0.1.0"
description = "Football AI Digital Twin: event-time historical match replay, tactical analytics and Fabric ingestion"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.5",
  "httpx>=0.27",
  "numpy>=1.26",
  "tzdata; sys_platform == 'win32'",   # Windows has no system time-zone database (pyarrow timestamps need one)
]

[project.optional-dependencies]
dev = ["pytest>=8"]
fabric = ["deltalake>=1.1", "pyarrow>=16"]
ml = ["pandas>=2.0", "scipy>=1.11", "scikit-learn>=1.3"]

[project.scripts]
footballiq-ingest = "footballiq.ingest.statsbomb:main"
footballiq-agents = "footballiq.agents.setup:main"

[tool.setuptools.packages.find]
include = ["footballiq*"]

[tool.setuptools.package-data]
footballiq = ["data/*.json"]   # name_pools.json: the fictional naming universe (footballiq/aliases.py)

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
